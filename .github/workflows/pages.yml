name: Deploy FILMS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site
        run: |
          python3 -c "import json;d=json.load(open('public/data/films.json'));f=d['films'];assert len(f)==31,len(f);assert all(x['poster'] and x['questions'] for x in f);print(len(f),'titles OK')"
          node --check public/app.js
          node --check public/sw.js
          python3 -c "import json;json.load(open('public/manifest.webmanifest'))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
