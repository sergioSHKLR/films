<!doctype html><html lang="en"><head><meta charset="utf-8"><title>FILMS</title><meta name="viewport" content="width=device-width,initial-scale=1">
<script>
/* Path-style deep links (/films/film/<slug>) -> hash routes */
(function(){var base='/films/',p=location.pathname;var i=p.indexOf(base);var rest=i>=0?p.slice(i+base.length):'';
location.replace(base+(rest?'#/'+rest.replace(/\/$/,''):''));})();
</script><style>body{background:#0f1115;color:#efe8d6;font-family:ui-monospace,monospace;padding:40px}</style></head>
<body><p>Redirecting to <a href="/films/">FILMS</a>…</p></body></html>
